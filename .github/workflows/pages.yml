name: pages

# Builds the Astro site and deploys it to GitHub Pages on every push to main.
# One-time repo setup: Settings → Pages → Source = "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build with Astro
        uses: withastro/action@v6
        # withastro/action installs deps, runs `astro build` and uploads the
        # `dist/` artifact for the deploy job. `base`/`site` come from config.
        # Public (non-secret) build config for the pricing/portal API. Set these
        # as repo Actions *variables* (Settings → Secrets and variables →
        # Actions → Variables); unset = pricing shows "coming soon".
        env:
          PUBLIC_LICENSE_API_BASE: ${{ vars.PUBLIC_LICENSE_API_BASE }}
          PUBLIC_APP_API_KEY: ${{ vars.PUBLIC_APP_API_KEY }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
