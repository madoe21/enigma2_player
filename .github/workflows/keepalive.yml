name: keepalive

# Pings the license server's health endpoint every ~10 minutes so Render's
# free tier never spins the instance down (15 min idle → ~50 s cold start,
# which hurts license checks and PayPal webhooks). One always-on service fits
# Render's 750 free instance hours per month; this public repo has unlimited
# Actions minutes. Remove once the service moves to a paid always-on plan
# (license_server ADR-0001).
#
# Note: GitHub pauses schedules after ~60 days without repo activity — any
# release/commit here resets that clock.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          for i in 1 2 3; do
            if curl -fsS --max-time 60 "https://license-server-5d7i.onrender.com/health"; then
              echo; echo "OK"; exit 0
            fi
            echo "attempt $i failed (cold start?), retrying in 30s"; sleep 30
          done
          echo "health check failed after 3 attempts"; exit 1
