name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  # The site (enigma2_player_source-bdb). Still its own job rather than a step
  # in `verify`: it needs its own Node version and its own install, and a
  # failure should say "site" in the job list. Since the cutover it is the only
  # site in the repository - the Astro tree the root used to hold is gone
  # (enigma2_player-hsf.1), and `verify` now only checks repository-level files.
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7

      # The version is read from site/.node-version rather than written here,
      # so the pin lives next to the code that needs it. The Angular 22 CLI
      # refuses anything below 24.15.0 and says so only at build time.
      - uses: actions/setup-node@v6
        with:
          node-version-file: site/.node-version
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        run: npm ci

      # No style step here any more: one pinned Prettier at the repository root
      # checks this tree in the same pass as everything else (the
      # `Code style (Prettier)` step in `verify`). Two installs of the same
      # exact version, each with its own config and ignore file, is how the
      # formatting drifted in the first place (enigma2_player-63s/hsf.1).

      # A hard gate, no allow list: this tree is new, it reports nothing, and
      # the moment it reports a high or critical the build stops. The Astro
      # tree accumulated sixteen advisories unseen because nobody ever
      # installed it, so nobody ever audited it (enigma2_player-yrq).
      - name: Dependency audit (no high or critical)
        run: node ../.github/scripts/audit-gate.mjs .

      - name: Build (prerendered, five languages)
        run: npm run build

      - name: Unit tests (Vitest)
        run: npm test

      # The checks that are cheap and mechanical, before the browser is
      # downloaded. Each one has been a real finding rather than a formality:
      # a translatable sentence left in a template, a key missing from a
      # maintained language or read by nobody, an unfilled legal placeholder.
      - name: No translatable text in a template
        run: npm run check:literals

      - name: Translation dictionaries complete
        run: npm run check:translations

      - name: Legal placeholders
        run: npm run check:placeholders

      - name: Browser for the end-to-end tests
        run: npx playwright install --with-deps chromium

      # Against the built files, because this site has no backend: what a
      # visitor and a crawler get is the output of the build.
      #
      # This is also where the declared page language is checked now. The root
      # used to run `npm run check:lang` against the Astro build for it
      # (enigma2_player-w83) - a page that lies about its language makes a
      # screen reader read it in the wrong voice, WCAG 2.2 SC 3.1.1 - and the
      # cutover did not drop that guard, it inherited it: `pages.spec.ts`,
      # `prerender.spec.ts` and `legal.spec.ts` assert `<html lang>` on every
      # prerendered route, for the same reason against the built output.
      - name: End-to-end tests (Playwright)
        run: npm run test:e2e

      # axe-core over all 66 pages in both consent states. It runs as its own
      # step so a failure says "accessibility" in the job list rather than
      # hiding inside the end-to-end run (enigma2_player-iaa). It is part of
      # test:e2e as well; this step is the label.
      - name: Accessibility (axe-core, WCAG 2.2 AA)
        run: npm run test:a11y

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The same comparison `pre-commit` step 4 makes locally, as a step of its own
      # (enigma2_player-3c5). A hook is the wrong place for the only copy of a check: it is
      # skippable, it does not exist on a fresh clone until somebody points core.hooksPath at
      # it, and it cannot see what arrives through a pull request. Needs nothing installed, so
      # it runs first. It also checks the executable bit, which is how nine hooks sat in the
      # index as mode 644 - ignored by git on every machine that is not Windows.
      - name: Hook trees in sync (.githooks vs .beads/hooks)
        run: bash .github/scripts/check-hook-sync.sh

      # Auto-detect stack and run style + tests. Extend per project.
      - name: Node
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v6
        with: { node-version: '22' }
      - name: Node verify
        if: hashFiles('package.json') != ''
        run: |
          npm ci || npm install
          npm test --if-present

      # The hooks themselves, under bats (enigma2_player-3c5). Deliberately not wired to
      # `npm test`, which `pre-commit` step 5 would then run on every single commit - one
      # throwaway repository per case, around fifty, each running these hooks again.
      #
      # This job is where the suite earns its keep: on Linux it also exercises the branches a
      # Windows developer can only skip (a PATH without node needs real symlinks), and it is the
      # only place that proves the hooks work at all on a checkout nobody has configured.
      - name: Hook tests (bats)
        if: hashFiles('package.json') != ''
        run: npm run test:hooks

      # And the tests' own gate: each mutant breaks one hook branch in a temp copy and the one
      # test that should notice has to go red. Hook tests are unusually easy to fake green -
      # nearly every branch of a hook ends in `exit 0`, so a check that does nothing looks
      # exactly like a check that passed. Twelve seconds for the whole set.
      - name: Hook tests notice defects (mutation check)
        if: hashFiles('package.json') != ''
        run: npm run test:hooks:mutate

      # Its own step, and hard. It used to be
      # `npx --yes prettier --check . || echo "::warning::prettier issues"`
      # buried in the step above: a warning in a log nobody opens, which is
      # how 53 files drifted from a style the repository claims to enforce
      # (enigma2_player-63s). `npx prettier`, not `npx --yes prettier`: the
      # pinned local version decides what correct looks like, never whatever
      # the registry published this morning.
      - name: Code style (Prettier)
        if: hashFiles('package.json') != ''
        run: npx prettier --check .

      # No allow list any more. It carried `astro` (critical) and `sharp`
      # (high), both unfixable without a two-major jump and both argued as
      # not exploitable in a static site (enigma2_player-yrq) - and both gone
      # with the Astro tree itself (enigma2_player-hsf.1). What is left at the
      # root is the pinned Prettier, so this gate is now plain: it fails on any
      # high or critical, with nothing excused.
      - name: Dependency audit (repository root, no exceptions)
        if: hashFiles('package.json') != ''
        run: node .github/scripts/audit-gate.mjs .

      - name: Python
        if: hashFiles('pyproject.toml','requirements.txt') != ''
        uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - name: Python verify
        if: hashFiles('pyproject.toml','requirements.txt') != ''
        run: |
          pip install black isort pytest || true
          black --check . || echo "::warning::black issues"
          isort --check-only . || echo "::warning::isort issues"
          pytest -q || echo "no tests"

      - name: Go
        if: hashFiles('go.mod') != ''
        uses: actions/setup-go@v6
        with: { go-version: 'stable' }
      - name: Go verify
        if: hashFiles('go.mod') != ''
        run: |
          test -z "$(gofmt -l .)" || { echo "::error::gofmt"; gofmt -l .; exit 1; }
          go test ./... || echo "no tests"

      - name: Dart/Flutter
        if: hashFiles('pubspec.yaml') != ''
        uses: subosito/flutter-action@v2
      - name: Dart verify
        if: hashFiles('pubspec.yaml') != ''
        run: |
          dart format --output=none --set-exit-if-changed . || echo "::warning::dart format"
          flutter analyze || dart analyze || true
          flutter test || dart test || echo "no tests"
