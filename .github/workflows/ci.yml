name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  # The Angular site under site/ (enigma2_player_source-bdb). Its own job, not
  # a step in `verify`: that one auto-detects a stack from the repository root,
  # where the Astro site still lives until its content has moved over
  # (enigma2_player_source-n5j). Two stacks in one repository for the duration
  # of the migration, and each one checked on its own terms.
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7

      # The version is read from site/.node-version rather than written here,
      # so the pin lives next to the code that needs it. The Angular 22 CLI
      # refuses anything below 24.15.0 and says so only at build time.
      - uses: actions/setup-node@v6
        with:
          node-version-file: site/.node-version
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        run: npm ci

      # This job had no style step at all, which is why 36 of its files had
      # drifted from its own `.prettierrc` (enigma2_player-63s). Prettier is a
      # pinned devDependency here and the version is exact, not a caret range:
      # a formatter patch release can change its output, and then the gate
      # fails on a file nobody touched.
      - name: Code style (Prettier)
        run: npm run check:format

      # A hard gate, no allow list: this tree is new, it reports nothing, and
      # the moment it reports a high or critical the build stops. The Astro
      # tree accumulated sixteen advisories unseen because nobody ever
      # installed it, so nobody ever audited it (enigma2_player-yrq).
      - name: Dependency audit (no high or critical)
        run: node ../.github/scripts/audit-gate.mjs .

      - name: Build (prerendered, five languages)
        run: npm run build

      - name: Unit tests (Vitest)
        run: npm test

      # The checks that are cheap and mechanical, before the browser is
      # downloaded. Each one has been a real finding rather than a formality:
      # a translatable sentence left in a template, a key missing from a
      # maintained language or read by nobody, an unfilled legal placeholder.
      - name: No translatable text in a template
        run: npm run check:literals

      - name: Translation dictionaries complete
        run: npm run check:translations

      - name: Legal placeholders
        run: npm run check:placeholders

      - name: Browser for the end-to-end tests
        run: npx playwright install --with-deps chromium

      # Against the built files, because this site has no backend: what a
      # visitor and a crawler get is the output of the build.
      - name: End-to-end tests (Playwright)
        run: npm run test:e2e

      # axe-core over all 66 pages in both consent states. It runs as its own
      # step so a failure says "accessibility" in the job list rather than
      # hiding inside the end-to-end run (enigma2_player-iaa). It is part of
      # test:e2e as well; this step is the label.
      - name: Accessibility (axe-core, WCAG 2.2 AA)
        run: npm run test:a11y

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Auto-detect stack and run style + tests. Extend per project.
      - name: Node
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v6
        with: {node-version: '22'}
      - name: Node verify
        if: hashFiles('package.json') != ''
        run: |
          npm ci || npm install
          npm test --if-present

      # Its own step, and hard. It used to be
      # `npx --yes prettier --check . || echo "::warning::prettier issues"`
      # buried in the step above: a warning in a log nobody opens, which is
      # how 53 files drifted from a style the repository claims to enforce
      # (enigma2_player-63s). `npx prettier`, not `npx --yes prettier`: the
      # pinned local version decides what correct looks like, never whatever
      # the registry published this morning.
      - name: Code style (Prettier)
        if: hashFiles('package.json') != ''
        run: npx prettier --check .

      # The Astro site's own check, and it needs the build: the bug it guards
      # only appears once the configured base path is in the URL, so it is
      # invisible to a unit test and to a local dev run (enigma2_player-w83).
      # A page that lies about its language makes a screen reader read it in
      # the wrong voice - WCAG 2.2 SC 3.1.1.
      - name: Astro build + declared page language
        if: hashFiles('astro.config.mjs') != ''
        run: |
          npm run build
          npm run check:lang

      # The Astro tree at the repository root, with two named exceptions.
      # `astro` (critical) and `sharp` (high) are only fixable by jumping two
      # major versions, on a dependency that the migration deletes - and
      # neither is exploitable here: the vulnerable Astro features
      # (`define:vars`, `server:defer`, `getSecret`) appear nowhere in `src/`,
      # the site is static with no server at all, and `sharp` touches only our
      # own images at build time. Justification in enigma2_player-yrq; the
      # gate fails on anything else, and on an exception that stops applying.
      - name: Dependency audit (Astro tree, with named exceptions)
        if: hashFiles('package.json') != ''
        run: node .github/scripts/audit-gate.mjs . --allow astro,sharp

      - name: Python
        if: hashFiles('pyproject.toml','requirements.txt') != ''
        uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Python verify
        if: hashFiles('pyproject.toml','requirements.txt') != ''
        run: |
          pip install black isort pytest || true
          black --check . || echo "::warning::black issues"
          isort --check-only . || echo "::warning::isort issues"
          pytest -q || echo "no tests"

      - name: Go
        if: hashFiles('go.mod') != ''
        uses: actions/setup-go@v6
        with: {go-version: 'stable'}
      - name: Go verify
        if: hashFiles('go.mod') != ''
        run: |
          test -z "$(gofmt -l .)" || { echo "::error::gofmt"; gofmt -l .; exit 1; }
          go test ./... || echo "no tests"

      - name: Dart/Flutter
        if: hashFiles('pubspec.yaml') != ''
        uses: subosito/flutter-action@v2
      - name: Dart verify
        if: hashFiles('pubspec.yaml') != ''
        run: |
          dart format --output=none --set-exit-if-changed . || echo "::warning::dart format"
          flutter analyze || dart analyze || true
          flutter test || dart test || echo "no tests"
